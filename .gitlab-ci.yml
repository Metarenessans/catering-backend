stages:
  - deploy

deploy_backend:
  stage: deploy
  image: alpine:latest
  before_script:
    - apk add --no-cache openssh-client
    - eval $(ssh-agent -s)
    - echo "$SSH_PRIVATE_KEY" | tr -d '\r' | ssh-add -
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    - ssh-keyscan $SERVER_IP >> ~/.ssh/known_hosts
    - chmod 644 ~/.ssh/known_hosts
  script:
    - |
      ssh $SERVER_USER@$SERVER_IP "
        set -e
        echo 'Starting secure zero-downtime backend deployment...'
        
        # 1. Clean up any previous failed build
        rm -rf /root/catering/backend_build /root/catering/backend_old
        
        # 2. Copy current live files to build directory (including virtualenv for fast pip install)
        cp -rp /root/catering/backend /root/catering/backend_build
        
        # 3. Pull new code into build directory
        cd /root/catering/backend_build
        git reset --hard
        git pull origin main
        
        # 4. Install dependencies
        ./venv/bin/pip install -r requirements.txt
        
        # 5. Check Django code and configuration integrity
        ./venv/bin/python manage.py check
        
        # 6. Apply database migrations with auto-recovery for password issues
        echo 'Applying database migrations...'
        if ! ./venv/bin/python manage.py migrate; then
          echo 'Migration failed! Checking database container status...'
          if docker ps --filter name=catering_db_container --status running | grep -q catering_db_container; then
            echo 'Database container is running. Attempting auto-recovery by resetting postgres password...'
            docker exec -i catering_db_container psql -U postgres -c \"ALTER USER postgres WITH PASSWORD 'C@t3r1ng_S3cur3_Db_2026!';\" || true
            echo 'Retrying migrations...'
            ./venv/bin/python manage.py migrate
          else
            echo 'Database container is not running or other error occurred!'
            exit 1
          fi
        fi
        
        # 7. Collect static files
        echo 'Collecting static files...'
        ./venv/bin/python manage.py collectstatic --noinput
        
        # 8. Atomic directory swap
        echo 'Validation passed! Swapping directories atomically...'
        mv /root/catering/backend /root/catering/backend_old
        mv /root/catering/backend_build /root/catering/backend
        rm -rf /root/catering/backend_old
        
        # 9. Restart service in PM2
        pm2 restart backend
        
        # 10. Verify deployment health
        echo 'Verifying deployment health...'
        sleep 3
        if curl -s -f http://localhost:8000/api/v1/catalog/ > /dev/null; then
          echo 'Verification successful! Backend is healthy and serving APIs.'
          echo 'Deployment completed successfully!'
        else
          echo 'Verification failed! Backend is not healthy. Showing PM2 logs:'
          pm2 logs backend --lines 30 --no-daemon
          exit 1
        fi
      "
  only:
    - main
  when: manual

