stages:
  - deploy

deploy_backend:
  stage: deploy
  image: alpine:latest
  before_script:
    - apk add --no-cache openssh-client
    - eval $(ssh-agent -s)
    - echo "$SSH_PRIVATE_KEY" | tr -d '\r' | ssh-add -
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    - ssh-keyscan $SERVER_IP >> ~/.ssh/known_hosts
    - chmod 644 ~/.ssh/known_hosts
    - echo "SECRET_KEY=${PROD_SECRET_KEY}" > .env
    - echo "DEBUG=False" >> .env
    - echo "ALLOWED_HOSTS=localhost,127.0.0.1,157.22.192.108,chefmil-furshet.ru,www.chefmil-furshet.ru" >> .env
    - echo "DB_NAME=catering_db" >> .env
    - echo "DB_USER=postgres" >> .env
    - echo "DB_PASSWORD=${PROD_DB_PASSWORD}" >> .env
    - echo "DB_HOST=127.0.0.1" >> .env
    - echo "DB_PORT=5433" >> .env
    - echo "CORS_ALLOWED_ORIGINS=http://localhost:3000,http://127.0.0.1:3000,https://chefmil-furshet.ru,https://www.chefmil-furshet.ru" >> .env
    - echo "TELEGRAM_BOT_TOKEN=${PROD_TELEGRAM_BOT_TOKEN}" >> .env
    - echo "TG_API_ID=${PROD_TG_API_ID}" >> .env
    - echo "TG_API_HASH=${PROD_TG_API_HASH}" >> .env
    - scp -o StrictHostKeyChecking=no .env $SERVER_USER@$SERVER_IP:/tmp/.env_backend
    - |
      ssh -o StrictHostKeyChecking=no $SERVER_USER@$SERVER_IP << 'ENDSSH'
        set -e

        BUILD_DIR=/root/catering/backend_build
        LIVE_DIR=/root/catering/backend

        echo "========================================"
        echo " BACKEND ZERO-DOWNTIME DEPLOY START"
        echo "========================================"

        # 1. Clean up any previous failed build
        echo "[1/9] Cleaning up stale build directory..."
        rm -rf "$BUILD_DIR" /root/catering/backend_old

        # 2. Copy current live backend to build dir
        #    This includes venv so pip install only installs diffs
        echo "[2/9] Copying live backend to build dir..."
        cp -rp "$LIVE_DIR" "$BUILD_DIR"

        # 3. Pull new code into build dir (live dir is UNTOUCHED)
        echo "[3/9] Pulling latest code into build dir..."
        cd "$BUILD_DIR"
        git reset --hard
        git pull origin main

        # 4. Move uploaded .env to build dir
        echo "[4/9] Moving generated .env to build dir..."
        mv /tmp/.env_backend "$BUILD_DIR/.env"

        # 4b. Install Python dependencies
        echo "[4b/9] Installing Python dependencies..."
        ./venv/bin/python -m pip install --quiet -r requirements.txt

        # 5. Django system check (catches config errors, missing settings, etc.)
        echo "[5/9] Running Django system check..."
        ./venv/bin/python manage.py check --deploy 2>&1 | grep -v "WARNINGS" || true
        # Run again strictly to catch ERRORS (not warnings)
        ./venv/bin/python manage.py check

        # 6. Apply database migrations with auto-recovery for password issues
        echo "[6/9] Applying database migrations..."
        MIGRATE_OK=0
        if ./venv/bin/python manage.py migrate; then
          MIGRATE_OK=1
        else
          echo "  -> Migration failed! Checking database container..."
          if docker ps --filter name=catering_db_container --filter status=running | grep -q catering_db_container; then
            echo "  -> DB container is running. Attempting password auto-recovery..."
            docker exec -i catering_db_container psql -U postgres \
              -c "ALTER USER postgres WITH PASSWORD 'C@t3r1ng_S3cur3_Db_2026!';" || true
            echo "  -> Retrying migration..."
            if ./venv/bin/python manage.py migrate; then
              MIGRATE_OK=1
            fi
          fi
        fi

        if [ "$MIGRATE_OK" -eq 0 ]; then
          echo "ERROR: Migrations failed after auto-recovery attempt. Aborting deployment."
          echo "Live backend is UNTOUCHED."
          exit 1
        fi

        # 7. Collect static files
        echo "[7/9] Collecting static files..."
        ./venv/bin/python manage.py collectstatic --noinput --clear -v 0

        # 8. Atomic directory swap
        #    Only happens after ALL validation steps above pass
        echo "[8/9] Validation passed! Performing atomic directory swap..."
        mv "$LIVE_DIR" /root/catering/backend_old
        mv "$BUILD_DIR" "$LIVE_DIR"
        rm -rf /root/catering/backend_old

        # 9. Restart the backend service
        echo "[9/9] Restarting backend via PM2..."
        pm2 restart backend

        # 10. Deployment health check
        echo "  Waiting for backend to come up..."
        sleep 5
        if curl -sf http://localhost:8000/api/v1/catalog/ > /dev/null; then
          echo ""
          echo "========================================"
          echo " DEPLOYMENT SUCCESSFUL!"
          echo " Backend API is live and healthy."
          echo "========================================"
        else
          echo "ERROR: Health check failed! Backend may be down."
          echo "Showing PM2 logs:"
          pm2 logs backend --lines 50 --nostream
          exit 1
        fi
      ENDSSH
  only:
    - main
  when: manual
